name: Controles

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: HTML (HTMLHint)
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: HTML controleren
        run: npx --yes htmlhint@1 "public/**/*.html"

  css:
    name: CSS (Stylelint)
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      # Lokaal installeren: stylelint zoekt de config vanaf de projectmap, niet in de npx-cache
      - name: Stylelint installeren
        run: npm install --no-save --no-package-lock stylelint@16 stylelint-config-recommended@14

      - name: CSS controleren
        run: npx stylelint "public/assets/css/**/*.css"

  links:
    name: Links en bestanden (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      # Alleen interne links: social media blokkeert bots en zou willekeurig falen
      - name: Links controleren
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/public" "./public/**/*.html" "./*.md" "./docs/*.md"
          fail: true

  tests:
    name: Browsertests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testgereedschap installeren
        run: npm install --no-package-lock

      - name: Browser installeren
        run: npx playwright install --with-deps chromium

      # Opent de site in een echte browser, op desktop en mobiel (zie tests/)
      - name: Tests draaien
        run: npx playwright test

      - name: Rapport bewaren bij fouten
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 14
